# Render Blueprint — one click deploys the web app + a free Postgres database.
# Dashboard → New → Blueprint → pick this repo. Then fill in the three "sync: false" values when asked.
services:
  - type: web
    name: campussync
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: campussync-db
          property: connectionString
      - key: CAMPUSSYNC_SECRET
        generateValue: true
      - key: CAMPUSSYNC_ADMIN_KEY          # needed to reset demo data on the live server (/demo)
        generateValue: true
      - key: CAMPUSSYNC_TZ
        value: America/New_York
      - key: CAMPUSSYNC_DEMO
        value: "1"
      - key: GEMINI_API_KEY                # optional — without it the agents use built-in logic
        sync: false
      - key: GOOGLE_CLIENT_ID              # from Google Cloud → Credentials (docs/GOOGLE_CALENDAR.md)
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

databases:
  - name: campussync-db
    plan: free
    databaseName: campussync
    user: campussync
